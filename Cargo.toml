[package]
name = "data-viewer-3d"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
default = ["app"]
app = ["dep:winit", "dep:env_logger", "dep:pollster"]

[[bin]]
name = "data-viewer-3d"
required-features = ["app"]

[dependencies]
anyhow = "1.0.100"
futures = "0.3"
bytemuck = "1.24.0"
env_logger = { version = "0.11.8", optional = true }
glam = "0.30.8"
log = "0.4.28"
num-traits = "0.2.19"
pollster = { version = "0.4.0", optional = true }
tiff = "0.10.3"
wgpu = "29"
winit = { version = "0.30.12", optional = true }
imbuf = "0.3.2"
image = { version = "0.25.9", features = ["png"] }
thiserror = "2.0.18"
fontdue = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "29" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}
